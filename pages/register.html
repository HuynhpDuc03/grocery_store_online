<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Tạp Hóa Online</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
        }

        .form {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            text-align: center;
            color: #278d46;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #278d46;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .login {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #278d46;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="form">
        <h2>Đăng ký</h2>

        <label>Họ tên</label>
        <input type="text" placeholder="Nhập họ tên">

        <label>Email</label>
        <input type="email" placeholder="Nhập email">

        <label>Số điện thoại</label>
        <input type="tel" placeholder="Nhập số điện thoại">

        <label>Mật khẩu</label>
        <input type="password" placeholder="Nhập mật khẩu">

        <label>Xác nhận mật khẩu</label>
        <input type="password" placeholder="Nhập lại mật khẩu">

        <button>Đăng ký</button>

        <div class="login">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
